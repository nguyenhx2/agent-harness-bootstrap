# CodeQL configuration for the javascript-typescript analysis only. The other
# three languages in the matrix pass no config file, so nothing here can widen
# or narrow their scan.
#
# The point of scanning JavaScript at all is tools/harness-view/src/ui.js: it
# renders a scanned repository's own file contents and node labels into the DOM,
# so it is the one place in this repo where a DOM XSS sink could exist. The
# exclusions below exist so that finding is not buried.

name: "javascript-typescript"

paths-ignore:
  # Vendored third-party libraries, committed so the viewer works with no
  # network. They are not this repo's code, cannot be fixed here, and are
  # minified - which defeats dataflow and turns every alert into noise. Their
  # versions and provenance are tracked in tools/harness-view/vendor/README.md;
  # upgrading them is how a real issue in one gets fixed, not a CodeQL alert.
  - "tools/harness-view/vendor"
  - "**/*.min.js"
  # Build output, not source. dist/ is regenerated by scripts/build_wiki.py and
  # the release pipeline, so an alert here is a duplicate of one in the input.
  - "dist"
  # The intro video's maintainer tool. It runs only by hand with --generate, posts
  # fixed prompts to one fixed HTTPS API, and writes the returned audio to fixed
  # paths under video/intro/audio/ after checking the bytes are MP3 and capped in
  # size. CodeQL's http-to-file and file-to-http queries describe exactly that
  # purpose (download audio, send the key in a header), so every alert is the
  # script doing its job. It ships in no skill and no release artifact.
  - "video/intro/scripts"
