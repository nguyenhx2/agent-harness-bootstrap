name: codeql

# Static analysis for the languages this repo actually ships. Three of them come
# from GitHub's own detection - `gh api repos/OWNER/REPO/code-scanning/default-setup`
# reports ["actions", "python", "rust"] - and javascript-typescript is added on top
# of that list deliberately, because detection missed it: see the matrix comment.
#
# `actions` is the one worth saying out loud. This repo ships three other workflows
# and a release pipeline that publishes artifacts, so a vulnerable workflow is a
# supply-chain problem for anyone installing the skills. CodeQL scans the workflow
# files themselves for that class.
#
# Advanced setup (this file) rather than default setup, deliberately: every control
# in this repository is a file you can read, diff and delete. A scanner configured
# through a settings page is not.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published CodeQL query reaches this repo without waiting
    # for the next commit. Monday 03:17 UTC - an odd minute, to avoid the top-of-hour
    # rush that makes hosted runners queue.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write   # required to upload the SARIF results
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
          # JavaScript was absent from that detected list for a bad reason, not a
          # good one: the repo's JavaScript lived inside <script> blocks
          # (202,543 bytes of it) with only two standalone .js files, so
          # detection reported none. The viewer's UI - the one page that renders
          # a scanned repository's own file contents and node labels into the
          # DOM, and therefore the one place a DOM XSS sink could exist - is now
          # tools/harness-view/src/ui.js, a real file the extractor can see.
          # `node --check` already proved it parses; nothing until now looked at
          # what it does with innerHTML.
          - language: javascript-typescript
            build-mode: none
            # Only this language gets a config file. The input is optional, and
            # the other three entries leave it empty, which the action treats as
            # unset - so their scans are unchanged by it.
            config-file: .github/codeql/javascript.yml

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ${{ matrix.config-file }}
          # security-extended adds the lower-severity and precision queries on top of
          # the default suite. This repo is small enough that the extra noise is
          # affordable, and the whole point of the harness is catching things early.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
