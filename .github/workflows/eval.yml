name: eval

# Runs the guardrail eval on every push and PR. The eval scaffolds a real harness and fires known-bad
# payloads at the generated hooks; it exits non-zero if any guardrail fails to block, or if it blocks
# something it should allow. It is a real test, so this is a real badge.
#
# BOTH hook flavors run here. That was a known gap until we established, while fixing the Cursor
# adapter, that GitHub's ubuntu runners ship `pwsh` - so the .ps1 twin can be exercised on the same
# runner as the .sh one. `--flavor ps1` runs the suite through BOTH, and the eval skips the .ps1
# half cleanly if no PowerShell is ever found, so the flag is safe to pass unconditionally.
#
# This matters because the published figure is 214/214 across both flavors. Before this, CI proved
# only the POSIX half, so a regression in the PowerShell hooks would have shipped green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, declared rather than inherited. Without this the jobs run with
# whatever the repository default grants, which CodeQL flags as
# actions/missing-workflow-permissions - and it is right: nothing here writes.
permissions:
  contents: read

jobs:
  guardrails:
    name: guardrail eval (both hook flavors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Run once, keep the output, then assert the run covered what the badge claims. The eval
      # skips the .ps1 half CLEANLY and still exits 0 when no PowerShell is found, so a green
      # tick alone would not notice pwsh disappearing from the runner image and quietly putting
      # us back to a single flavor.
      - name: Guardrail eval - does the safety floor survive a model downgrade?
        run: |
          set -o pipefail
          python eval/guardrail_eval.py --flavor ps1 2>&1 | tee eval.log
          grep -q -- "--- POSIX (.sh) ---"    eval.log || { echo "::error::the POSIX half did not run";      exit 1; }
          grep -q -- "--- Windows (.ps1) ---" eval.log || { echo "::error::the PowerShell half did not run"; exit 1; }

      - name: Benchmark - the harness must still scaffold clean
        run: python benchmark/benchmark.py

      - name: Cost model - roster profiles must compute
        run: python benchmark/model_cost.py

      # GitHub renders mermaid server-side and shows "Unable to render rich display" on a parse
      # error, naming neither the file nor the line. The only way to know is to render it. A
      # semicolon inside a message shipped once and broke two diagrams silently.
      #
      # mermaid-cli drives headless Chrome. The runner image has one, but puppeteer will not use it
      # unless told, and it downloads its own otherwise. Point it at the installed browser so the
      # step does not spend a minute fetching a second copy.
      - name: Set up Chrome for the mermaid renderer
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: chrome
        with:
          chrome-version: stable

      - name: Every mermaid diagram must actually render
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: python scripts/check_mermaid.py

      # A skill's SKILL.md version, its own CHANGELOG.md, and the other skill's version can drift
      # apart independently - each is edited by hand. This is the sync check for all three, run on
      # every push so drift is caught long before the release tag is pushed. It runs BEFORE the
      # figure check so a release-structure failure is never masked by a stale badge number.
      - name: CHANGELOGs and SKILL.md versions must stay in sync
        run: python scripts/validate_release.py

      # "No invented numbers" is a contributing rule. A rule nobody checks drifts: the session-tax
      # figure was once wrong in two files at the same time. This one is checked.
      - name: Figures in the docs must match what the scripts print
        run: python scripts/check_numbers.py

      # Both viewers ship as one file with an inline <script>. Nothing executes that JavaScript in
      # CI, so a syntax error used to ship silently: the page rendered its chrome and the canvas
      # stayed blank. node --check is the parser, not a heuristic.
      - name: Embedded page JavaScript must parse
        run: python scripts/check_js.py

      # A figure fails silently: it renders as a blank box, or as a box with a
      # missing connection, and nothing errors. All three checks here are a
      # failure that shipped - text that only existed once an animation ran, an
      # external font that never loaded, and an output box no arrow reached.
      - name: Figures must be self-contained and fully connected
        run: python scripts/check_svg.py

      # check_numbers.py reads text, and every figure in a clip is burned into pixels at render
      # time, so it could never see them. The README's first moving image read "guardrail eval
      # 69/69" for three releases while its own scene source said 107/107 - the number moved
      # twice and the GIF was re-rendered for neither. This compares each artifact against the
      # hash of the source it was rendered from.
      - name: Every shipped clip must match the source it was rendered from
        run: python scripts/check_media.py

      # The wiki lives in a separate git repository that nothing else reads, which is
      # exactly how wikis go stale. Its reference pages are generated from the assets,
      # so building them here means a change that breaks a page fails the build rather
      # than surfacing weeks later on a page nobody checks. This BUILDS and validates;
      # wiki.yml is what publishes, and only when the built output actually differs.
      - name: The wiki must still build from the assets
        run: python scripts/build_wiki.py

      # SCHEMA.md promises that harness-graph.py and `harness-view scan` write the SAME bytes
      # for the same repo, so a project can use either. Nothing checked it, and it had drifted
      # four ways at once: a files COUNT crashed the Python side, a [from, to] edge pair was
      # silently dropped by it, a YAML block list of tools came out as one item with the dash
      # still attached, and on Windows it wrote CRLF against the Rust side's LF. Two scanners
      # that disagree are worse than one.
      - name: Both graph scanners must agree byte for byte
        run: python scripts/check_graph_parity.py

      # The application icon is compiled into the Windows .exe by build.rs. A missing or
      # truncated icon.ico fails that build on the release runner, long after the commit
      # that broke it; this catches it on the PR instead.
      - name: Application icons must be present and complete
        run: python scripts/make_icons.py --check

      # The Cursor/Codex porter's hook adapter must actually block, not just render. It scaffolds a
      # harness, ports it, and fires sample Cursor payloads at the adapter.
      - name: Port adapter must enforce (Cursor/Codex)
        run: python harness-bootstrap/scripts/port.py --self-test

  scaffold-matrix:
    name: scaffold (${{ matrix.flavor }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flavor: posix
          - os: windows-latest
            flavor: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The scaffolder must produce a complete, variable-free harness on both hook flavors.
      # An unresolved {{VAR}} makes it exit non-zero, so this catches a placeholder shipped
      # into a rule file - which is the failure mode that would silently disarm a guardrail.
      - name: Scaffold a harness and assert no unresolved variables
        shell: python
        run: |
          import json, pathlib, subprocess, sys
          flavor = "${{ matrix.flavor }}"
          sys.path.insert(0, "eval")
          import guardrail_eval as G

          v = json.loads(json.dumps(G.VARS))
          v["flags"] = [flavor, "ui", "db", "ai", "ddd"]
          v["vars"]["HOOK_RUNNER"] = "bash" if flavor == "posix" else \
              "powershell -NoProfile -ExecutionPolicy Bypass -File"
          v["vars"]["HOOK_EXT"] = "sh" if flavor == "posix" else "ps1"

          pathlib.Path("ci-vars.json").write_text(json.dumps(v))
          r = subprocess.run(
              [sys.executable, "harness-bootstrap/scripts/scaffold.py",
               "--target", "ci-repo", "--vars", "ci-vars.json"],
              capture_output=True, text=True)
          print(r.stdout)
          if r.returncode != 0:
              print(r.stderr, file=sys.stderr)
              sys.exit("scaffold failed - see the UNRESOLVED VARIABLES block above")

          left = [p for p in pathlib.Path("ci-repo").rglob("*")
                  if p.is_file() and "{{" in p.read_text(encoding="utf-8", errors="replace")]
          if left:
              sys.exit(f"unsubstituted placeholders survived into: {[str(p) for p in left]}")

          json.loads(pathlib.Path("ci-repo/.claude/settings.json").read_text())
          print(f"OK: {flavor} harness scaffolded clean, settings.json parses")
