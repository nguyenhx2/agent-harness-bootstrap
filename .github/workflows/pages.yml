name: pages

# Serves the repo as a static site so the intro clips play in the browser
# (https://nguyenhx2.github.io/agent-harness-bootstrap/video/). This uploads the files as-is - no
# Jekyll - because the legacy Jekyll builder chokes on the spec-builder templates (their {{#IF_X}}
# blocks are Liquid-illegal, and a placeholder "<YYYY-MM-DD>" is not a valid Jekyll date). A .nojekyll
# file at the repo root keeps it that way.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress deploy; let each finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The landing page (index.html + index.ja.html) is a Vite build from site/ - the
      # built files are NOT committed. Overlaying dist/ onto the checkout root puts them
      # exactly where the old hand-written pages used to live, so every published URL
      # (/, /index.ja.html, /video/, /presentation/, docs/assets/...) stays valid and the
      # pages keep referencing the repo's own docs/assets images relatively.
      - name: Build the landing page
        run: |
          cd site
          npm ci
          npm run build
          cp -r dist/. ..
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      # deploy-pages caps its own wait at 600000 ms, so raising `timeout:` past that does nothing
      # (it warns and clamps). If a deploy aborts with "Timeout reached" while still reporting
      # deployment_in_progress, that is GitHub-side: re-run it. The artifact size is not the
      # trigger - the run that first added the Japanese clips deployed the same payload in 31s.
      - id: deployment
        uses: actions/deploy-pages@v4
