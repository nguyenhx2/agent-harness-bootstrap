name: release

# Builds and attaches the installable artifacts when a vX.Y.Z tag is pushed.
#
# This workflow exists because the first three releases of this repo were tags with no artifacts -
# a version nobody could install and nobody could identify once installed. Automating it means the
# failure cannot recur through forgetfulness.
#
# The gates run BEFORE the artifacts are built. A release that ships a harness whose guardrails do
# not block is worse than no release: it looks armed and is not.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "semver, no leading v (dry run - builds but does not publish)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version from the tag
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            # Strip a leading v here too - a "v1.8.0" dispatch input would otherwise produce
            # artifact names like harness-bootstrap-vv1.8.0.zip and fail the VERSION assert.
            V="${{ github.event.inputs.version }}"
            V="${V#v}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "resolved version: $V"

      # --- gates: these must pass before anything is packaged ---

      - name: Gate - guardrail eval must be green
        run: python eval/guardrail_eval.py

      - name: Gate - benchmark must run clean
        run: python benchmark/benchmark.py

      - name: Gate - preflight (semver, CHANGELOG section, manifest)
        run: python scripts/package.py --version "${{ steps.v.outputs.version }}" --check

      - name: Gate - per-skill CHANGELOGs valid and carry this version
        run: python scripts/validate_release.py "${{ steps.v.outputs.version }}"

      # --- build ---

      - name: Build artifacts
        run: python scripts/package.py --version "${{ steps.v.outputs.version }}"

      # Every release carries the eval and benchmark output for the exact commit it was cut from,
      # so the eval result and the numbers are provable per version, not just at head. package.py wipes
      # dist/ on build, so these are written AFTER it. They ship as release assets, not installables.
      - name: Capture the eval and benchmark for this release
        run: |
          V="${{ steps.v.outputs.version }}"
          {
            echo "# Guardrail eval - v$V"
            echo '```'
            python eval/guardrail_eval.py 2>&1
            echo '```'
          } > "dist/eval-results.md"
          {
            echo "# Benchmark - v$V"
            echo '```'
            python benchmark/benchmark.py 2>&1
            echo '```'
          } > "dist/benchmark-results.md"
          echo "captured eval-results.md and benchmark-results.md"

      - name: Assert VERSION is inside every archive
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile
          v = "${{ steps.v.outputs.version }}"
          bad = []
          for z in sorted(pathlib.Path("dist").glob("*.zip")):
              with zipfile.ZipFile(z) as zf:
                  stamps = [n for n in zf.namelist() if n.endswith("/VERSION")]
                  if not stamps:
                      bad.append(f"{z.name}: no VERSION file inside")
                      continue
                  for s in stamps:
                      got = zf.read(s).decode().strip()
                      if got != v:
                          bad.append(f"{z.name}: {s} says {got}, expected {v}")
          if bad:
              sys.exit("\n".join(bad))
          print("every archive carries a correct VERSION")
          PY

      - name: Generate release notes from the skills' CHANGELOGs
        run: |
          # CHANGELOG-driven: each skill's own CHANGELOG.md is the source of truth for its section
          # of the release body, not a hand-written summary. See scripts/release_notes.py.
          python3 scripts/release_notes.py "${{ steps.v.outputs.version }}" -o notes.md
          {
            echo ""
            echo "**Install**"
            echo "- \`unzip harness-bootstrap-v${{ steps.v.outputs.version }}.zip -d ~/.claude/skills/\`"
            echo "- \`unzip spec-builder-v${{ steps.v.outputs.version }}.zip -d ~/.claude/skills/\`"
            echo "- Verify with \`sha256sum -c SHA256SUMS\`"
          } >> notes.md
          cat notes.md

      - name: Publish the release with its artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # notes.md is now assembled per-skill (release_notes.py), so there is no single
          # hand-written theme line left to lift for the title - each skill's section says what
          # changed in it. The tag is the title.
          # Idempotent: a maintainer may have published the release by hand before this job ran.
          # Creating over an existing release fails, so edit-and-clobber in that case instead.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file notes.md
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file notes.md \
              dist/*
          fi
          echo "attached:"
          gh release view "${GITHUB_REF_NAME}" --json assets -q '.assets[].name'

  # Standalone application builds. Separate job so a compiler problem on one OS cannot
  # stop the skill zips from shipping, and so each target builds on its own runner
  # rather than through a cross toolchain that would need its own maintenance.
  #
  # `needs: release` is deliberate: the gates (including the Cargo.toml version sync)
  # live in that job, and the release has to exist before anything can be attached.
  binaries:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from the tag
        id: v
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"; V="${V#v}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Assert the crate version matches the release
        shell: bash
        run: |
          # The binary stamps its own version from Cargo.toml, so a mismatch here
          # would ship an .exe whose Properties tab disagrees with the release page.
          CV=$(grep -m1 '^version = ' tools/harness-view/Cargo.toml | cut -d'"' -f2)
          if [ "$CV" != "${{ steps.v.outputs.version }}" ]; then
            echo "Cargo.toml is $CV but the release is ${{ steps.v.outputs.version }}" >&2
            exit 1
          fi
          echo "crate version $CV matches the release"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: tools/harness-view

      - name: Verify the built binary reports the release version
        if: matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          # Only the natively-runnable targets: an aarch64 macOS runner cannot execute
          # the x86_64 slice, so asserting there would be theatre.
          BIN="tools/harness-view/target/${{ matrix.target }}/release/harness-view${{ matrix.ext }}"
          OUT=$("$BIN" --version)
          echo "$OUT"
          [ "$OUT" = "harness-view ${{ steps.v.outputs.version }}" ]

      - name: Package
        shell: bash
        run: |
          V="${{ steps.v.outputs.version }}"
          NAME="harness-view-$V-${{ matrix.target }}"
          mkdir -p "stage/$NAME"
          cp "tools/harness-view/target/${{ matrix.target }}/release/harness-view${{ matrix.ext }}" "stage/$NAME/"
          cp tools/harness-view/README.md tools/harness-view/SCHEMA.md "stage/$NAME/"
          mkdir -p out
          cd stage
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip "../out/$NAME.zip" "$NAME" >/dev/null
          else
            tar czf "../out/$NAME.tar.gz" "$NAME"
          fi
          cd ..
          ls -la out/

      - name: Checksum
        shell: bash
        run: |
          cd out
          for f in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256";
            else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          cat *.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --clobber keeps this idempotent, matching how the skill zips are attached:
          # a re-run of the workflow replaces the asset instead of failing on a duplicate.
          gh release upload "${GITHUB_REF_NAME}" out/* --clobber
          echo "attached $(ls out | tr '\n' ' ')"
