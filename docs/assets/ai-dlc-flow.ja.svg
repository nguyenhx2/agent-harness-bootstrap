<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1160" viewBox="0 0 880 1160" role="img" aria-labelledby="dlc-title dlc-desc" font-family="'Yu Gothic UI', 'Meiryo', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="dlc-title">エージェントIDEにおけるAI-DLC - spec-builder、harness-bootstrap、そしてその先で回るループ</title>
  <desc id="dlc-desc">エージェントIDEの中で回るAI駆動開発ライフサイクル、上から下へ。入力は人間から: アイデア、書き起こし、議事録、古いPRD、または既存のコードベース。それはspec-builderに流れ込む、モデル上で動くスキルで、ヒアリングし要件を決して勝手に作らない、未記載のものは担当者付きの未解決の課題としてフラグが立つ。次にharness-bootstrapへ流れる、これもモデル上で動き、brownfieldリポジトリならまずコードを読み、greenfieldなら仕様を読み、固定の顔ぶれではなくフラグに合わせてロースターを組む。帯の上の破線バイパスはbrownfieldの起点を示し、既存リポジトリはspec-builderを飛ばす。両スキルとも実ファイルをコピーするscaffold.pyを同梱する: 決定的、無料、書いたものを決して上書きしない。ディスク上の成果物はdocs/specsのセクション01から13、要件の契約書、そして.claudeフォルダとdocs/tasks、ボード: 16席、16ルール、22コマンド、10フック。次は任意のスキル探索で、候補は検出したスタックに合わせて選ばれ、提示前に全ファイルを読み、チェックを入れないものは入らず、/skill-wireで席に紐付けるまでどのスキルも役に立たない。それらがループに供給される、モデル上で動くループで: スラッシュnew-task、その後オーケストレーターが振り分け、spec-guardianが契約書をロックし、開発エージェントが実装し、テストを選んだ場合にqa-testが走り、code-reviewerとsecurity-reviewerが読み取り専用ゲートとして、あるいはsolo_reviewフラグ下では統合された1席として働き、スラッシュsecret-scanが走り、作業がマージされ、ボードが更新され、次のタスクが始まる。ループの内側では常に2つが働いている: フック、決定的でexit 2により、mainへのコミット、不正なコミットメッセージ、ADRの編集、.envの読み取りをブロックする。そしてdocs/tasks配下のボード、各ステップがセッションログの行を進みながら追記し、クラッシュしてもディスクから再開する。ループの下ではハーネス自体が可視化される: 制御面全体が.claude/state/harness-graph.jsonとして出力され、harness-viewがFlow・Graph・Assess・マスタープランの表示を描き、スラッシュharness-toggleがルール・コマンド・フックを1つずつ、コミット済みの台帳を通して無効化・再有効化する。ループはどのモデル階層でも同じ、ゲートは判断力ではなくシェルスクリプトだから。</desc>

