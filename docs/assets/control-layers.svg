<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="1104" viewBox="0 0 1202 1104" role="img" aria-labelledby="control-layers-title control-layers-desc"><title id="control-layers-title">Control layers: what the harness enforces, and what it only asks</title><desc id="control-layers-desc">The four control layers the harness-bootstrap quality gate names, ranked by hardness, with the agent's action passing down through them. Layer 1, the settings.json permissions.deny list, decides what the agent cannot see; it is absolute for what it names but a literal prefix match. Layer 2, PreToolUse hooks that exit 2, decides what it cannot do: protect-secrets, protect-harness, guard-destructive, guard-main-commit, check-commit-msg, protect-adr and guard-agent-spawn block, and guard-agent-scope only advises because the payload names no calling seat. An enforced band that is not one of the four follows: the seat frontmatter, with the tools allowlist, disallowedTools, maxTurns and the spawn caps. Layer 3, the agent-guardrails rule, and layer 4, the review commands, run on the model and are advisory. Below them, the files the enforced layers live in are guarded by protect-harness, which asks the user before an edit and refuses a shell write. A runtime band shows harness-toggle and the committed disabled.json ledger: HARD items, including the orchestrator and the review seats, need the typed phrase disable name, and SOFT items, including every other seat, need an explicit yes. A footnote maps the layers onto the README's five: FORCED, HARD, SCOPED, SOFT and HUMAN.</desc><defs/><g><g><g><g><g transform="translate(0.5,0.5)"><rect x="0" y="0" width="1200" height="1102" rx="5" ry="5" fill="#f8fafc" stroke="#cbd5e1"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#0F172A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px"><text x="30" y="48">Control layers: what the harness enforces, and what it only asks</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#475569" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="30" y="78">The four layers the quality gate names, ranked by hardness. Red and green are decided by the harness, with no model consulted; purple is decided by the model.</text></g></g></g><g><g><rect x="30" y="100" width="230" height="114" rx="5" ry="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px"><text x="46" y="134">LAYER 1</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px"><text x="46" y="158">Deny rules</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="179">what it cannot SEE</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="276" y="100" width="894" height="114" rx="5" ry="5" fill="#ffffff" stroke="#dc2626"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="134">settings.json permissions.deny: Read(**/.env), *.pem, *.key, secrets/**, git push --force, rm -rf,</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="162">plus the Restricted-data paths you name. A denied action never reaches a tool.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="190">Honest limit: a literal prefix, so a reordered command walks past it. Layer 2 is the gate.</text></g></g></g><g><g><rect x="30" y="238" width="230" height="114" rx="5" ry="5" fill="#fecaca" stroke="#991b1b" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px"><text x="46" y="272">LAYER 2</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px"><text x="46" y="296">Blocking hooks</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="317">what it cannot DO</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="276" y="238" width="894" height="114" rx="5" ry="5" fill="#ffffff" stroke="#991b1b"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="272">PreToolUse hooks that exit 2: protect-secrets, protect-harness, guard-destructive, guard-main-commit,</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="300">check-commit-msg, protect-adr, guard-agent-spawn. 27 hooks ship; eval 312/312 per hook flavour.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="328">guard-agent-scope only advises: the Edit/Write payload names no calling seat.</text></g></g></g><g><g><rect x="30" y="376" width="230" height="114" rx="5" ry="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#14532D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px"><text x="46" y="410">ALSO ENFORCED</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#14532D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px"><text x="46" y="434">Seat frontmatter</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#14532D" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="455">not one of the four</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="276" y="376" width="894" height="114" rx="5" ry="5" fill="#ffffff" stroke="#16a34a"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="410">tools: allowlist decides what a seat can REACH; disallowedTools keeps Edit and Write off every read-only seat.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="438">maxTurns is the circuit breaker on a stuck agent: debugger 30, code-reviewer 25, history-tracker 10.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="466">Spawn caps: depth 2, at most 4 at once. scaffold.py refuses a seat that leaves any of these out.</text></g></g></g><g><g><rect x="30" y="514" width="230" height="86" rx="5" ry="5" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px"><text x="46" y="548">LAYER 3</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px"><text x="46" y="572">Guardrail rule</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="593">advisory</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="276" y="514" width="894" height="86" rx="5" ry="5" fill="#ffffff" stroke="#9333ea"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="548">.claude/rules/agent-guardrails.md: the behaviour layers 1 and 2 cannot express. Loaded every session,</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="576">it holds only if the model complies. So does the agent body; effort: is a throttle, not a rein.</text></g></g></g><g><g><rect x="30" y="624" width="230" height="86" rx="5" ry="5" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px"><text x="46" y="658">LAYER 4</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px"><text x="46" y="682">Review commands</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="703">what still got through</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="276" y="624" width="894" height="86" rx="5" ry="5" fill="#ffffff" stroke="#9333ea"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="658">/review-changes and /secret-scan before merge, dispatched to the read-only review seats.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="686">They run on the model: a second pair of eyes, not a wall.</text></g></g></g><g><g><path d="M 145 214 L 145 226.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 145 235.76 L 140.5 226.76 L 149.5 226.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><path d="M 145 352 L 145 364.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 145 373.76 L 140.5 364.76 L 149.5 364.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><path d="M 145 490 L 145 502.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 145 511.76 L 140.5 502.76 L 149.5 502.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><path d="M 145 600 L 145 612.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 145 621.76 L 140.5 612.76 L 149.5 612.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><rect x="30" y="736" width="230" height="114" rx="5" ry="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px"><text x="46" y="770">GUARDED</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px"><text x="46" y="794">The guards' files</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="815">decided by you</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="276" y="736" width="894" height="114" rx="5" ry="5" fill="#ffffff" stroke="#1d4ed8"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="770">The files the enforced layers live in are enforced too. protect-harness asks you before an agent edits</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="798">.claude/settings*.json or .claude/hooks/, and refuses a shell write there; without it a guard is</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="826">one echo &gt;&gt; .claude/hooks/... away from exit 0. Verified live in Claude Code, in bypassPermissions mode.</text></g></g></g><g><g><rect x="30" y="864" width="230" height="142" rx="5" ry="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E293B" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px"><text x="46" y="898">RUNTIME</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E293B" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px"><text x="46" y="922">Switching off</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E293B" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="943">on the record</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="276" y="864" width="894" height="142" rx="5" ry="5" fill="#ffffff" stroke="#64748b"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="898">/harness-toggle moves a file to .claude/disabled/&lt;kind&gt;/ and records it in the committed .claude/disabled.json.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="926">HARD, the typed phrase disable &lt;name&gt;: protect-secrets, guard-agent-spawn, protect-harness, security-privacy,</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="954">agent-guardrails, /review-changes, and the orchestrator, code-reviewer, security-reviewer, reviewer, spec-guardian seats.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="982">SOFT, an explicit yes: guard-main-commit, check-commit-msg, protect-adr, ai-governance, and every other seat.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#475569" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="30" y="1045">Against the README's five layers: layer 1 is FORCED, layer 2 is HARD, the frontmatter is SCOPED, layers 3 and 4 run on the model like SOFT, and the typed phrase is HUMAN.</text></g></g></g><g><g><rect x="30" y="1064" width="16" height="16" rx="5" ry="5" fill="#fecaca" stroke="#991b1b" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="54" y="1079">enforced - one of the four</text></g></g></g><g><g><rect x="275" y="1064" width="16" height="16" rx="5" ry="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="299" y="1079">enforced - outside the four</text></g></g></g><g><g><rect x="530" y="1064" width="16" height="16" rx="5" ry="5" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="554" y="1079">advisory - the model decides</text></g></g></g><g><g><rect x="775" y="1064" width="16" height="16" rx="5" ry="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="799" y="1079">a person decides</text></g></g></g><g><g><rect x="945" y="1064" width="16" height="16" rx="5" ry="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="969" y="1079">record on disk</text></g></g></g></g></g></g></svg>
