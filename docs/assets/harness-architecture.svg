<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="1178" viewBox="0 0 1202 1178" role="img" aria-labelledby="harness-architecture-title harness-architecture-desc"><title id="harness-architecture-title">Harness reference architecture: the model is the only swappable layer</title><desc id="harness-architecture-desc">The harness drawn bottom-up in seven layers, plus a viewer band. L7 orchestration runs on the model and fields a fitted roster: the long, tests, solo_review, db_engineer and db_seeder flags decide which seats exist. L6 the model slot, drawn dashed: seats declare a tier, and model-tiers.md binds judgment to opus, implementation to sonnet and mechanical to haiku; the tier is swappable, the vendor is not. A red line marks that everything below it is unchanged when the model is swapped. L5 the policy plane: 17 rules, the agent bodies and the data-classification table, advisory. L4 the context plane, volatile: 7 unconditional rules always loaded and 10 path-scoped rules on demand, 75 percent of the rule content. L3 the state plane: the board, the task files, the disabled.json ledger and the run archive, durable in git. L2 the enforcement plane, drawn thickest: deny rules, hooks that exit 2, tool allowlists, maxTurns, spawn caps, protect-harness and the harness-toggle ledger, with the guardrail eval passing 314 of 314 cases per hook flavour and no model consulted. L1 the work: the repository, branches and data. Below, the view: harness-graph.json, which harness-view renders as Flow, Graph, Assess and Master-plan views and scores with no model in the loop.</desc><defs/><g><g><g><g><g transform="translate(0.5,0.5)"><rect x="0" y="0" width="1200" height="1176" rx="5" ry="5" fill="#f8fafc" stroke="#cbd5e1"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#0F172A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px"><text x="30" y="48">Harness reference architecture: the model is the only swappable layer</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#475569" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="30" y="78">Read bottom-up. Each layer names who enforces it. Everything below the red line is unchanged when the model is swapped.</text></g></g></g><g><g><rect x="30" y="100" width="230" height="114" rx="5" ry="5" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px"><text x="46" y="134">L7</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px"><text x="46" y="158">Orchestration</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="179">runs on the model</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="276" y="100" width="894" height="114" rx="5" ry="5" fill="#ffffff" stroke="#9333ea"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="134">orchestrator routes -&gt; spec-guardian locks the contract -&gt; dev implements -&gt; qa-test, if chosen -&gt; review gate -&gt; merge.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="162">The roster is fitted, not fixed: the long, tests, solo_review, db_engineer and db_seeder flags decide which seats exist.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="190">An agent's 'done' is a claim, checked against git and the session log, never taken on trust.</text></g></g></g><g><g><rect x="30" y="228" width="230" height="114" rx="5" ry="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="2" stroke-dasharray="12 8"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#4C1D95" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px"><text x="46" y="262">L6</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#4C1D95" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px"><text x="46" y="286">The model slot</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#4C1D95" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="307">the swappable part</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="276" y="228" width="894" height="114" rx="5" ry="5" fill="#ffffff" stroke="#6d28d9" stroke-dasharray="6 4"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="262">Seats declare a tier and model-tiers.md binds it: judgment -&gt; opus, implementation -&gt; sonnet, mechanical -&gt; haiku.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="290">fable is accepted by model: but no seat binds it. scaffold.py refuses a seat whose model: contradicts its row.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="318">Tier is swappable, vendor is not: another vendor needs an execution adapter, a port and not a config change.</text></g></g></g><g><g><rect x="30" y="358" width="1140" height="30" rx="5" ry="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px"><text x="600" y="379">Everything BELOW this line is unchanged when you swap the model</text></g></g></g><g><g><rect x="30" y="404" width="230" height="86" rx="5" ry="5" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px"><text x="46" y="438">L5</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px"><text x="46" y="462">Policy plane</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="483">advisory</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="276" y="404" width="894" height="86" rx="5" ry="5" fill="#ffffff" stroke="#9333ea"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="438">.claude/rules/ (17 rules), the agent bodies, and the data-classification table: Public, Internal, Confidential,</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="466">Restricted. Enforced by nobody; it shapes behaviour. Classification beats seat tier.</text></g></g></g><g><g><rect x="30" y="504" width="230" height="114" rx="5" ry="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="12 8"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E293B" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px"><text x="46" y="538">L4</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E293B" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px"><text x="46" y="562">Context plane</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E293B" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="583">volatile, budgeted</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="276" y="504" width="894" height="114" rx="5" ry="5" fill="#ffffff" stroke="#64748b" stroke-dasharray="6 4"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="538">Always loaded: CLAUDE.md -&gt; @AGENTS.md, 7 unconditional rules, the agent body and the tool schemas.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="566">On demand: 10 path-scoped rules, loaded on a matching file touch, 75% of the rule content.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="594">Enforced by the context window: billed every turn, lost on compaction.</text></g></g></g><g><g><rect x="30" y="632" width="230" height="114" rx="5" ry="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E293B" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px"><text x="46" y="666">L3</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E293B" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px"><text x="46" y="690">State plane</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E293B" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="711">durable, on disk</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="276" y="632" width="894" height="114" rx="5" ry="5" fill="#ffffff" stroke="#64748b"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="666">docs/tasks/master-plan.md, the board; docs/tasks/active/TASK-NNN.md, criteria, decisions and a session log;</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="694">.claude/disabled.json, what is off and why; .claude/state/history/, the machine-local run archive.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="722">Enforced by git. Survives compaction, session end and a dead IDE: a fresh agent resumes from here.</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="30" y="760" width="230" height="114" rx="5" ry="5" fill="#fecaca" stroke="#991b1b" stroke-width="3"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px"><text x="46" y="794">L2</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px"><text x="46" y="818">Enforcement plane</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="839">no model consulted</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="276" y="760" width="894" height="114" rx="5" ry="5" fill="#ffffff" stroke="#991b1b"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="794">permissions.deny -&gt; cannot SEE. PreToolUse hooks that exit 2 -&gt; cannot DO; 27 hooks ship.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="822">tools allowlist -&gt; cannot REACH. maxTurns and the spawn caps -&gt; cannot run away. protect-harness guards the guards.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="850">/harness-toggle switches a control off on the record, in disabled.json. eval/guardrail_eval.py: 314/314 per hook flavour.</text></g></g></g><g><g><rect x="30" y="888" width="230" height="86" rx="5" ry="5" fill="#ffffff" stroke="#475569" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#0F172A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px"><text x="46" y="922">L1</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#0F172A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px"><text x="46" y="946">The work</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#0F172A" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="967">what it protects</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="276" y="888" width="894" height="86" rx="5" ry="5" fill="#ffffff" stroke="#475569"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="922">The repository, the branches, the data: what every layer above exists to protect,</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="950">and the one thing here the harness cannot regenerate.</text></g></g></g><g><g><rect x="30" y="1000" width="230" height="114" rx="5" ry="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px"><text x="46" y="1034">THE VIEW</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px"><text x="46" y="1058">harness-view</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="1079">no model in the loop</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="276" y="1000" width="894" height="114" rx="5" ry="5" fill="#ffffff" stroke="#1d4ed8"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="1034">.claude/state/harness-graph.json holds every layer above as nodes in one deterministic file.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="1062">harness-view renders Flow, Graph, Assess and Master-plan views of it and scores it against a published rubric:</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="294" y="1090">a plain rules engine, no network, exit 1 on a high finding, so a browser and a CI job cannot disagree.</text></g></g></g><g><g><rect x="30" y="1138" width="16" height="16" rx="5" ry="5" fill="#fecaca" stroke="#991b1b" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="54" y="1153">deterministic - the harness enforces</text></g></g></g><g><g><rect x="360" y="1138" width="16" height="16" rx="5" ry="5" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="384" y="1153">model / advisory</text></g></g></g><g><g><rect x="580" y="1138" width="16" height="16" rx="5" ry="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="604" y="1153">file on disk (dashed: volatile)</text></g></g></g><g><g><rect x="880" y="1138" width="16" height="16" rx="5" ry="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="904" y="1153">read-only view</text></g></g></g></g></g></g></svg>
