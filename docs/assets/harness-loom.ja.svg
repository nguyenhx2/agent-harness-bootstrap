    <text x="1042" y="879" font-size="9.5" fill="#93A4C0" text-anchor="middle">任意のルールやフックを無効化</text>

    <rect x="1152" y="846" width="196" height="44" rx="8" fill="#111A2E" stroke="#3B5478" stroke-width="1"/>
    <text x="1250" y="864" font-size="10.5" font-weight="700" fill="#E8EEF9" text-anchor="middle">監視</text>
    <text x="1250" y="879" font-size="9.5" fill="#93A4C0" text-anchor="middle">ファイル変更に応じて再走査</text>
  </g>

  <!-- ===== 左段の注記 ===== -->
  <text x="24" y="534" font-size="11" font-weight="700" fill="#6FB8F5">なぜ図が動くのか</text>
  <text x="24" y="554" font-size="10" fill="#7C8AA6">左の糸は互いにばらばらの速度で</text>
  <text x="24" y="570" font-size="10" fill="#7C8AA6">流れる。枠の内側では同じ速度で</text>
  <text x="24" y="586" font-size="10" fill="#7C8AA6">流れる。枠がそう強いるからだ。</text>
  <text x="24" y="602" font-size="10" fill="#7C8AA6">出力の線はまったく動かない。</text>
  <text x="24" y="626" font-size="10" fill="#93A4C0">混沌、そして規律、そして完成。</text>

  <text x="24" y="690" font-size="11" font-weight="700" fill="#6FB8F5">運ではなく秩序</text>
  <text x="24" y="710" font-size="10" fill="#7C8AA6">ガードレールはシェルスクリプトと</text>
  <text x="24" y="726" font-size="10" fill="#7C8AA6">終了コードであり、モデルの判断で</text>
  <text x="24" y="742" font-size="10" fill="#7C8AA6">はない。モデルを入れ替えても安全</text>
  <text x="24" y="758" font-size="10" fill="#7C8AA6">性の下限はバイト単位で同一。</text>
</svg>
