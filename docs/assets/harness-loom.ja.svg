<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="loom-title loom-desc" font-family="'Yu Gothic UI', 'Meiryo', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="loom-title">ハーネスは織機である: もつれた意図が入り、秩序ある成果が出てくる</title>
  <desc id="loom-desc">システム全体を織機として描いた概要図。左端は入力、すなわち生の意図であり、実際に持ち込まれる形として、一行のアイデア、会議の議事録、既存のドキュメント、既存のリポジトリ、空のリポジトリ、書きかけの仕様書が並ぶ。そこから色とりどりの糸がほどけて右へ進み、互いにもつれ合う。糸はハーネスの外側にある spec-builder に入る。spec-builder の仕事は一つだけで、あらゆる入力形式を国際標準に沿った一つの契約に変換することである。その契約が、harness-bootstrap と名づけられた大きな枠として描かれたハーネスに入る。枠の内側では、ルールとフックが上から中央のエージェントに降りてくる。ルールは Conventional Commits や機密情報の保護といった規約を担い、パスでスコープされる。フックはツール呼び出しの前後で発火し、終了コード 2 は呼び出しを遮断する。枠の右側には同じ階層の二つのパネルが並ぶ。スキル探索は、このプロジェクトのマニフェストを走査して技術スタックを判定し、それに合うスキルを見つける。読み取る対象には requirements.txt、Gemfile、csproj、build.gradle、pnpm-workspace.yaml、さらにマーケットプレイスのカタログが含まれる。その下のスキル配線は、選ばれたスキルを、それを必要とするエージェントの席に接続する。利用者が選ばない限り何もインストールされない。この二つがスキルに、スキルがエージェントにつながる。エージェントは織機のくびれであり、すべてが織り合わされる場所である。くびれの下からは、単一の色で秩序立った三つの成果物が、それぞれ独立した接続を持って出ていく。グラフ付きドキュメント、担当者つきのタスク計画、グラフ付きコードである。枠の下部には状態があり、プロンプト、実行履歴、タスクボードを保持する。エージェントはこれを読み書きし、状態はコンパクションと再起動を越えて残る。この状態こそハーネスビューアが読むものである。ビューアは枠の下にあり、四つの機能を持つ。すべての配線を見せるフローとグラフの表示、ハーネスを採点して欠けているものを名指す評価、任意のルールやフックを無効化する切り替え、ファイル変更に応じて再走査する監視である。そのいずれにもモデルは関与しない。この図の要点は、混沌が入り、制御され検証可能な成果が出てくるということである。</desc>

