    <style>
      /* 英語版と同じ規律: アニメーションが無くても図は完全に描かれる。
         GitHub は README の画像を img として描画し、そこではアニメーション
         クロックが動かない。以前このリポジトリで、文字がアニメーション
         頼りだった図が空箱として出荷された。可視性をアニメーションに
         依存させることはここでは決してしない。

         動きは意味を持たなければ雑音でしかない。意味のなかった移動する
         点は削除し、残る動きは三段階で一つのことを語る。

           .chaos*  左の糸は互いに異なる速度と向きで流れる = 混沌
           .sync    枠の内側の糸はすべて同じ速度で流れる   = 規律
           (なし)   出力の線はまったく動かない             = 完成 */
      .chaos1 { animation: drift  7s linear infinite; }
      .chaos2 { animation: drift 11s linear infinite reverse; }
      .chaos3 { animation: drift 16s linear infinite; }
      .sync   { animation: drift  9s linear infinite; }

      .ring  { animation: spin 26s linear infinite; transform-origin: 860px 420px; }
      .ring2 { animation: spin 38s linear infinite reverse; transform-origin: 860px 420px; }
      .breathe { animation: breathe 5s ease-in-out infinite; }

      @keyframes drift   { to { stroke-dashoffset: -48; } }
      @keyframes spin    { to { transform: rotate(360deg); } }
      @keyframes breathe { 0%,100% { opacity: .30; } 50% { opacity: .62; } }

      @media (prefers-reduced-motion: reduce) {
        .chaos1, .chaos2, .chaos3, .sync, .ring, .ring2, .breathe {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </defs>

