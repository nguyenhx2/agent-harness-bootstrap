<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="722" viewBox="0 0 1202 722" role="img" aria-labelledby="harness-overview-title harness-overview-desc"><title id="harness-overview-title">全体像: 入力、spec-builder、harness-bootstrap、状態、harness-view</title><desc id="harness-overview-desc">システム全体を左から右へ描いた図。左には持ち込むものが並ぶ: 一行のアイデア、会議の議事録、既存のドキュメント、既存のリポジトリ、空のリポジトリ、書きかけの仕様書。それらは spec-builder へ流れ、spec-builder は docs/specs/ に一つの契約を書き出す。契約は harness-bootstrap へ渡り、harness-bootstrap はコードベースそのものも読んで、六つの部品からハーネスを構築する: パス単位で適用され必要な場所でだけ読み込まれるルール、プロンプトではなくシェルでブロックするフック、リポジトリの目的（コード、調査、戦略、文書。このリリースで新設）に合わせて構成されるエージェントロスター、Inline・Direct・Standard・Guarded の各ティアへのルーティング（オーケストレーターを通るのは Guarded のみ）、発見し /new-skill で作成し利用するエージェントに配線するスキル、そして verify-plan が差分に必要なテストとレビューを過不足なく選ぶ検証。作業が進むにつれ、ハーネスは状態をディスクに書き込む: タスクボード、実行履歴、コンパクションを越えて残るチェックポイント。harness-view はハーネスとその状態を読み、表示・採点・切り替え・監視する。</desc><defs/><g><g><g><g><g transform="translate(0.5,0.5)"><rect x="0" y="0" width="1200" height="720" rx="9" ry="9" fill="#f8fafc" stroke="#cbd5e1"/></g></g><g><g><rect x="30" y="90" width="210" height="360" rx="5" ry="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#0F172A" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" font-weight="bold" text-anchor="middle" font-size="16px"><text x="135" y="124">持ち込むもの</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="50" y="138" width="170" height="40" rx="5" ry="5" fill="#ffffff" stroke="#cbd5e1"/></g><g><g fill="#334155" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" text-anchor="middle" font-size="14px"><text x="135" y="164">一行のアイデア</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="50" y="188" width="170" height="40" rx="5" ry="5" fill="#ffffff" stroke="#cbd5e1"/></g><g><g fill="#334155" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" text-anchor="middle" font-size="14px"><text x="135" y="214">会議の議事録</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="50" y="238" width="170" height="40" rx="5" ry="5" fill="#ffffff" stroke="#cbd5e1"/></g><g><g fill="#334155" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" text-anchor="middle" font-size="14px"><text x="135" y="264">既存のドキュメント</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="50" y="288" width="170" height="40" rx="5" ry="5" fill="#ffffff" stroke="#cbd5e1"/></g><g><g fill="#334155" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" text-anchor="middle" font-size="14px"><text x="135" y="314">既存のリポジトリ</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="50" y="338" width="170" height="40" rx="5" ry="5" fill="#ffffff" stroke="#cbd5e1"/></g><g><g fill="#334155" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" text-anchor="middle" font-size="14px"><text x="135" y="364">空のリポジトリ</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="50" y="388" width="170" height="40" rx="5" ry="5" fill="#ffffff" stroke="#cbd5e1"/></g><g><g fill="#334155" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" text-anchor="middle" font-size="14px"><text x="135" y="414">書きかけの仕様書</text></g></g></g><g><g><rect x="290" y="150" width="190" height="84" rx="5" ry="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/></g><g><g fill="#4C1D95" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" font-weight="bold" text-anchor="middle" font-size="17px"><text x="385" y="199.5">spec-builder</text></g></g></g><g><g><rect x="290" y="316" width="190" height="84" rx="5" ry="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/></g><g><g fill="#0F172A" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" text-anchor="middle" font-size="14px"><text x="385" y="355.5">一つの契約</text><text x="385" y="372.5">docs/specs/ へ</text></g></g></g><g><g><path d="M 240 192 L 278.76 192" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 287.76 192 L 278.76 196.5 L 278.76 187.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><path d="M 385 234 L 385 304.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 385 313.76 L 380.5 304.76 L 389.5 304.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g><g><g fill="#334155" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" text-anchor="middle" font-size="13px"><rect fill="#F8FAFC" stroke="none" x="359" y="268" width="54" height="17" stroke-width="0"/><text x="385" y="280.5">書き出す</text></g></g></g><g><g><rect x="530" y="90" width="640" height="360" rx="5" ry="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" font-weight="bold" text-anchor="middle" font-size="16px"><text x="850" y="124">harness-bootstrap がハーネスを構築する</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="556" y="146" width="4" height="112" fill="#2563eb" stroke="none"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" font-weight="bold" text-anchor="start" font-size="16px"><text x="572" y="166">ルール</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" text-anchor="start" font-size="14px"><text x="572" y="192">パス単位で適用され、</text><text x="572" y="209">必要な場所でだけ</text><text x="572" y="226">読み込まれる</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="761" y="146" width="4" height="112" fill="#2563eb" stroke="none"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" font-weight="bold" text-anchor="start" font-size="16px"><text x="777" y="166">フック</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" text-anchor="start" font-size="14px"><text x="777" y="192">プロンプトではなく</text><text x="777" y="209">シェルでブロックする</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="966" y="146" width="4" height="112" fill="#2563eb" stroke="none"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" font-weight="bold" text-anchor="start" font-size="16px"><text x="982" y="166">エージェントロスター</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" text-anchor="start" font-size="14px"><text x="982" y="192">リポジトリの目的に</text><text x="982" y="209">合わせて構成: コード、</text><text x="982" y="226">調査、戦略、文書（新）</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="556" y="296" width="4" height="112" fill="#2563eb" stroke="none"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" font-weight="bold" text-anchor="start" font-size="16px"><text x="572" y="316">ルーティング</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" text-anchor="start" font-size="14px"><text x="572" y="342">Inline / Direct /</text><text x="572" y="359">Standard / Guarded</text><text x="572" y="376">オーケストレーターを</text><text x="572" y="393">通るのは Guarded のみ</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="761" y="296" width="4" height="112" fill="#2563eb" stroke="none"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" font-weight="bold" text-anchor="start" font-size="16px"><text x="777" y="316">スキル</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" text-anchor="start" font-size="14px"><text x="777" y="342">発見する、</text><text x="777" y="359">/new-skill で作成する、</text><text x="777" y="376">利用するエージェント</text><text x="777" y="393">に配線する</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="966" y="296" width="4" height="112" fill="#2563eb" stroke="none"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" font-weight="bold" text-anchor="start" font-size="16px"><text x="982" y="316">検証</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" text-anchor="start" font-size="14px"><text x="982" y="342">verify-plan が差分に</text><text x="982" y="359">必要なテストとレビュー</text><text x="982" y="376">を過不足なく選ぶ</text></g></g></g><g><g><path d="M 480 358 L 518.76 358" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 527.76 358 L 518.76 362.5 L 518.76 353.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><path d="M 135 90 L 135 60 Q 135 50 145 50 L 840 50 Q 850 50 850 60 L 850 78.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 850 87.76 L 845.5 78.76 L 854.5 78.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g><g><g fill="#334155" font-family="Helvetica, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" text-anchor="middle" font-size="13px"><rect fill="#F8FAFC" stroke="none" x="408" y="43" width="171" height="17" stroke-width="0"/><text x="493" y="55.5">コードベースそのものを読む</text></g></g></g><g><g><rect x="530" y="520" width="640" height="170" rx="5" ry="5" fi