<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="722" viewBox="0 0 1202 722" role="img" aria-labelledby="harness-overview-title harness-overview-desc"><title id="harness-overview-title">How it all fits together: inputs, spec-builder, harness-bootstrap, state and harness-view</title><desc id="harness-overview-desc">A left-to-right overview of the system. On the left is what you bring: a one-line idea, meeting transcripts, legacy docs, an existing repo, an empty repo, or half-written specs. These flow into spec-builder, which writes one contract into docs/specs/. The contract flows into harness-bootstrap, which also reads the codebase itself and builds the harness out of six parts: rules that are path-scoped so each loads only where it applies; hooks that block in the shell rather than in the prompt; an agent roster sized to the repository's purpose (code, research, strategy or docs, new in this release); routing across the Inline, Direct, Standard and Guarded tiers, where only Guarded work goes through the orchestrator; skills that are discovered, created with /new-skill and wired to the agent that uses them; and proportionate verification, where verify-plan picks the tests and reviews a diff needs. As work runs, the harness writes state to disk: the task board, the run history, and checkpoints that survive compaction. harness-view reads the harness and that state, and shows, scores, toggles and watches it.</desc><defs/><g><g><g><g><g transform="translate(0.5,0.5)"><rect x="0" y="0" width="1200" height="720" rx="9" ry="9" fill="#f8fafc" stroke="#cbd5e1"/></g></g><g><g><rect x="30" y="90" width="210" height="360" rx="5" ry="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#0F172A" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px"><text x="135" y="124">What you bring</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="50" y="138" width="170" height="40" rx="5" ry="5" fill="#ffffff" stroke="#cbd5e1"/></g><g><g fill="#334155" font-family="Helvetica" text-anchor="middle" font-size="14px"><text x="135" y="164">A one-line idea</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="50" y="188" width="170" height="40" rx="5" ry="5" fill="#ffffff" stroke="#cbd5e1"/></g><g><g fill="#334155" font-family="Helvetica" text-anchor="middle" font-size="14px"><text x="135" y="214">Meeting transcripts</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="50" y="238" width="170" height="40" rx="5" ry="5" fill="#ffffff" stroke="#cbd5e1"/></g><g><g fill="#334155" font-family="Helvetica" text-anchor="middle" font-size="14px"><text x="135" y="264">Legacy docs</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="50" y="288" width="170" height="40" rx="5" ry="5" fill="#ffffff" stroke="#cbd5e1"/></g><g><g fill="#334155" font-family="Helvetica" text-anchor="middle" font-size="14px"><text x="135" y="314">An existing repo</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="50" y="338" width="170" height="40" rx="5" ry="5" fill="#ffffff" stroke="#cbd5e1"/></g><g><g fill="#334155" font-family="Helvetica" text-anchor="middle" font-size="14px"><text x="135" y="364">An empty repo</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="50" y="388" width="170" height="40" rx="5" ry="5" fill="#ffffff" stroke="#cbd5e1"/></g><g><g fill="#334155" font-family="Helvetica" text-anchor="middle" font-size="14px"><text x="135" y="414">Half-written specs</text></g></g></g><g><g><rect x="290" y="150" width="190" height="84" rx="5" ry="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/></g><g><g fill="#4C1D95" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="17px"><text x="385" y="199.5">spec-builder</text></g></g></g><g><g><rect x="290" y="316" width="190" height="84" rx="5" ry="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/></g><g><g fill="#0F172A" font-family="Helvetica" text-anchor="middle" font-size="14px"><text x="385" y="355.5">One contract</text><text x="385" y="372.5">in docs/specs/</text></g></g></g><g><g><path d="M 240 192 L 278.76 192" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 287.76 192 L 278.76 196.5 L 278.76 187.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><path d="M 385 234 L 385 304.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 385 313.76 L 380.5 304.76 L 389.5 304.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g><g><g fill="#334155" font-family="Helvetica" text-anchor="middle" font-size="13px"><rect fill="#F8FAFC" stroke="none" x="368" y="268" width="36" height="17" stroke-width="0"/><text x="385" y="280.5">writes</text></g></g></g><g><g><rect x="530" y="90" width="640" height="360" rx="5" ry="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px"><text x="850" y="124">harness-bootstrap builds the harness</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="556" y="146" width="4" height="112" fill="#2563eb" stroke="none"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px"><text x="572" y="166">Rules</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="572" y="192">Path-scoped, so each one</text><text x="572" y="209">loads only where it</text><text x="572" y="226">applies</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="761" y="146" width="4" height="112" fill="#2563eb" stroke="none"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px"><text x="777" y="166">Hooks</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="777" y="192">Block in the shell, not</text><text x="777" y="209">in the prompt</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="966" y="146" width="4" height="112" fill="#2563eb" stroke="none"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px"><text x="982" y="166">Agent roster</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="982" y="192">Sized to the repo's</text><text x="982" y="209">purpose: code, research,</text><text x="982" y="226">strategy, docs (new)</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="556" y="296" width="4" height="112" fill="#2563eb" stroke="none"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px"><text x="572" y="316">Routing</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="572" y="342">Inline, Direct, Standard,</text><text x="572" y="359">Guarded - only Guarded</text><text x="572" y="376">goes through the</text><text x="572" y="393">orchestrator</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="761" y="296" width="4" height="112" fill="#2563eb" stroke="none"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px"><text x="777" y="316">Skills</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="777" y="342">Discover, create with</text><text x="777" y="359">/new-skill, wire to the</text><text x="777" y="376">agent that uses it</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="966" y="296" width="4" height="112" fill="#2563eb" stroke="none"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px"><text x="982" y="316">Verification</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="982" y="342">verify-plan picks the</text><text x="982" y="359">tests and reviews a diff</text><text x="982" y="376">needs, no more</text></g></g></g><g><g><path d="M 480 358 L 518.76 358" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 527.76 358 L 518.76 362.5 L 518.76 353.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><path d="M 135 90 L 135 60 Q 135 50 145 50 L 840 50 Q 850 50 850 60 L 850 78.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 850 87.76 L 845.5 78.76 L 854.5 78.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g><g><g fill="#334155" font-family="Helvetica" text-anchor="middle" font-size="13px"><rect fill="#F8FAFC" stroke="none" x="420" y="43" width="147" height="17" stroke-width="0"/><text x="493" y="55.5">reads the codebase itself</text></g></g></g><g><g><rect x="530" y="520" width="640" height="170" rx="5" ry="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px"><text x="550" y="554">State on disk</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="550" y="570" width="190" height="96" rx="5" ry="5" fill="#ffffff" stroke="#f59e0b"/></g><g><g fill="#0F172A" font-family="Helvetica" text-anchor="middle" font-size="14px"><text x="645" y="624">Task board</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="755" y="570" width="190" height="96" rx="5" ry="5" fill="#ffffff" stroke="#f59e0b"/></g><g><g fill="#0F172A" font-family="Helvetica" text-anchor="middle" font-size="14px"><text x="850" y="624">Run history</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="960" y="570" width="190" height="96" rx="5" ry="5" fill="#ffffff" stroke="#f59e0b"/></g><g><g fill="#0F172A" font-family="Helvetica" text-anchor="middle" font-size="14px"><text x="1055" y="615.5">Checkpoints that</text><text x="1055" y="632.5">survive compaction</text></g></g></g><g><g><path d="M 850 450 L 850 508.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 850 517.76 L 845.5 508.76 L 854.5 508.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g><g><g fill="#334155" font-family="Helvetica" text-anchor="middle" font-size="13px"><rect fill="#F8FAFC" stroke="none" x="794" y="478" width="113" height="17" stroke-width="0"/><text x="850" y="490.5">writes as work runs</text></g></g></g><g><g><rect x="30" y="520" width="450" height="170" rx="5" ry="5" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#064E3B" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px"><text x="50" y="554">harness-view</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="50" y="576">reads the harness and its state</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="50" y="596" width="93" height="70" rx="5" ry="5" fill="#ffffff" stroke="#34d399"/></g><g><g fill="#0F172A" font-family="Helvetica" text-anchor="middle" font-size="14px"><text x="96.5" y="637">Show</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="1