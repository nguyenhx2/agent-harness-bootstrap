<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="Agent Harness Bootstrap - AIエージェントが自律的かつ安全に動くための枠組み">
  <defs>
    <linearGradient id="bn-edge" gradientUnits="userSpaceOnUse" x1="200" y1="70" x2="200" y2="330">
      <stop offset="0" stop-color="#6FA0C0"/>
      <stop offset="0.55" stop-color="#2C5F87"/>
      <stop offset="1" stop-color="#1D3557"/>
    </linearGradient>
    <linearGradient id="bn-node" gradientUnits="userSpaceOnUse" x1="200" y1="70" x2="200" y2="330">
      <stop offset="0" stop-color="#7FB2D4"/>
      <stop offset="1" stop-color="#2C5F87"/>
    </linearGradient>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F8FC"/>
      <stop offset="1" stop-color="#E8EFF7"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="400" fill="url(#bn-bg)"/>

  <!-- faint oversized shield echo, right side -->
  <g opacity="0.08" transform="translate(1150,10) scale(1.5)">
    <path d="M128 18 C154 32 182 40 208 44 C210 96 208 132 200 160 C190 196 164 222 128 240 C92 222 66 196 56 160 C48 132 46 96 48 44 C74 40 102 32 128 18 Z"
          fill="none" stroke="#1D3557" stroke-width="10"/>
    <path d="M62 132 Q128 84 194 132 Q128 180 62 132 Z" fill="#1D3557"/>
    <circle cx="128" cy="130" r="27" fill="#F5F8FC"/>
  </g>

  <!-- the mark: shield, eye, and the governed graph -->
  <g transform="translate(96,60) scale(1.1)">

  <defs>
    <!-- The shield: guardrails. Deep navy sinking to near-black at the point, electric rim light. -->
    <linearGradient id="sh-body" gradientUnits="userSpaceOnUse" x1="128" y1="20" x2="128" y2="240">
      <stop offset="0" stop-color="#2A4A9F"/>
      <stop offset="0.45" stop-color="#1D3557"/>
      <stop offset="1" stop-color="#101B33"/>
    </linearGradient>
    <linearGradient id="sh-rim" gradientUnits="userSpaceOnUse" x1="128" y1="20" x2="128" y2="240">
      <stop offset="0" stop-color="#6FB8F5"/>
      <stop offset="1" stop-color="#35348F"/>
    </linearGradient>
    <!-- The eye: oversight. Light sclera so the graph reads against the navy. -->
    <linearGradient id="sh-eye" gradientUnits="userSpaceOnUse" x1="128" y1="96" x2="128" y2="168">
      <stop offset="0" stop-color="#EAF4FC"/>
      <stop offset="1" stop-color="#BFDCF2"/>
    </linearGradient>
    <radialGradient id="sh-iris" gradientUnits="userSpaceOnUse" cx="122" cy="124" r="34">
      <stop offset="0" stop-color="#6FB8F5"/>
      <stop offset="0.6" stop-color="#3B6FE0"/>
      <stop offset="1" stop-color="#35348F"/>
    </radialGradient>
  </defs>

  <!-- Shield: the guardrail boundary. No outer frame - the shield IS the boundary. -->
  <path d="M128 18
           C 154 32 182 40 208 44
           C 210 96 208 132 200 160
           C 190 196 164 222 128 240
           C 92 222 66 196 56 160
           C 48 132 46 96 48 44
           C 74 40 102 32 128 18 Z"
        fill="url(#sh-body)" stroke="url(#sh-rim)" stroke-width="7" stroke-linejoin="round"/>

  <!-- The graph above the eye: the roster, held inside the shield. Varied nodes - the seats are
       not identical and neither are the marks. Edges run down into the iris: everything the team
       does passes through oversight. -->
  <g stroke="#6FB8F5" stroke-width="5" stroke-linecap="round" opacity="0.85" fill="none">
    <path d="M128 60 L128 100"/>
    <path d="M88 74 L113 106"/>
    <path d="M168 74 L143 106"/>
    <path d="M88 74 L128 60"/>
    <path d="M168 74 L128 60"/>
  </g>
  <circle cx="128" cy="58" r="11" fill="#8FD0FF"/>
  <polygon points="88,64 97,69 97,79 88,84 79,79 79,69" fill="#5A8FE8"/>
  <polygon points="168,64 177,69 177,79 168,84 159,79 159,69" fill="#5A8FE8"/>

  <!-- The eye: readable oversight. -->
  <path d="M62 132 Q128 84 194 132 Q128 180 62 132 Z" fill="url(#sh-eye)"/>
  <circle cx="128" cy="130" r="27" fill="url(#sh-iris)"/>
  <circle cx="128" cy="130" r="11" fill="#101B33"/>
  <circle cx="136" cy="121" r="5" fill="#EAF4FC"/>

  <!-- Two small nodes below: the work products, still inside the shield, still watched. -->
  <g stroke="#4f74d8" stroke-width="4.5" stroke-linecap="round" opacity="0.8" fill="none">
    <path d="M104 196 L119 152"/>
    <path d="M152 196 L137 152"/>
  </g>
  <circle cx="102" cy="200" r="8" fill="#5A8FE8"/>
  <polygon points="152,192 160,196.5 160,205.5 152,210 144,205.5 144,196.5" fill="#8FD0FF"/>

  </g>

  <!-- wordmark -->
  <g font-family="'Yu Gothic UI', 'Meiryo', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="440" y="185" font-size="84" font-weight="700" fill="#1D3557" letter-spacing="-1" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      Agent Harness Bootstrap
    </text>
    <text x="443" y="248" font-size="30" font-weight="400" fill="#2C5F87">
      AIエージェントが自律的かつ安全に動くための枠組み。
    </text>
    <text x="443" y="300" font-size="23" font-weight="400" fill="#3E6E93" opacity="0.95">
      あなたとAIが共に理解できる仕様。あなたのリポジトリに合わせたチーム。助言ではなく遮断するガードレール。
    </text>
  </g>
</svg>
