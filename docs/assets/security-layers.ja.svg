<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="1092" viewBox="0 0 1202 1092" role="img" aria-labelledby="security-layers-title security-layers-desc"><title id="security-layers-title">設計によるセキュリティ: エージェントと取り消せない操作の間にあるもの</title><desc id="security-layers-desc">AI エージェントの次の操作と実行の間にある 5 つのセキュリティ層の図。SOFT はモデルが判定する AGENTS.md、パス限定ルール、席のプロンプト。SCOPED はランタイムが判定する席ごとのツール許可、読み取り専用のレビュアー、maxTurns、固定モデル、生成上限、検証台帳。FORCED は権限システムが判定する拒否ルールで、秘密ファイル、force push、hard reset、rm -rf、デプロイ、DB リセットを止めるが前方一致のみ。HARD はシェルスクリプトが exit 2 で判定する常時と hooks_strict のフックで、失敗時は止める。HUMAN はすべての層の上にあり、ハーネス自身の設定とフックへの編集は確認を求め、シェルからの書き込みは拒否し、HARD の制御を外すには入力した語句がコミットされたファイルに記録される。下の 2 枚は証明 (フック形式ごとのガードレール評価、Linux・macOS・Windows の CI、Claude Code での実機確認) と、強制していないこと。</desc><defs/><g><g><g><g><g transform="translate(0.5,0.5)"><rect x="0" y="0" width="1200" height="1090" rx="5" ry="5" fill="#f8fafc" stroke="#cbd5e1"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#0F172A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px"><text x="30" y="48">設計によるセキュリティ: エージェントと取り消せない操作の間にあるもの</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#475569" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="30" y="78">モデルに任されるのは最初の層だけです。その下の各層は、モデルが言いくるめられないものが判定し、層を外せるのは人だけです。</text></g></g></g><g><g><rect x="30" y="100" width="200" height="50" rx="5" ry="5" fill="#ffffff" stroke="#9333ea" stroke-width="2"/></g><g><g fill="#0F172A" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px"><text x="130" y="131">エージェントの次の操作</text></g></g></g><g><g><rect x="30" y="176" width="200" height="112" rx="5" ry="5" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px"><text x="46" y="212">SOFT</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px"><text x="46" y="237">ガイダンス</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="263">判定: モデル</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="250" y="176" width="920" height="112" rx="5" ry="5" fill="#ffffff" stroke="#9333ea"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="210">AGENTS.md、パス限定のルール (agent-guardrails、security-privacy)、各席のプロンプト。</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="238">正しい行動を起こりやすくする層。実測ベンチマークでは、フックが動く前に危険な依頼を</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="266">すべて拒否した。ただしモデルが上書きすることも、コンパクションで落ちることもある。</text></g></g></g><g><g><rect x="30" y="306" width="200" height="112" rx="5" ry="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#14532D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px"><text x="46" y="342">SCOPED</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#14532D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px"><text x="46" y="367">席の制限</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#14532D" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="393">判定: ランタイム</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="250" y="306" width="920" height="112" rx="5" ry="5" fill="#ffffff" stroke="#16a34a"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="340">席ごとの tools 許可リスト。レビュー席は Edit と Write を disallowedTools に持つ。</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="368">maxTurns、固定のモデルと effort、生成の深さ 2・同時 4 まで、検証台帳は合格済みの再レビューを拒否。</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="396">席は与えられていないツールを呼べない。</text></g></g></g><g><g><rect x="30" y="436" width="200" height="112" rx="5" ry="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px"><text x="46" y="472">FORCED</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px"><text x="46" y="497">拒否ルール</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="523">判定: 権限システム</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="250" y="436" width="920" height="112" rx="5" ry="5" fill="#ffffff" stroke="#dc2626"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="470">.env*、鍵、secrets/ の読み取り。git push --force、reset --hard、rm -rf、デプロイ、DB リセット。</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="498">PR の作成・マージとデプロイは確認を求める。操作はツールに届かない。</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="526">名指ししたものには絶対だが、前方一致のみ: rm -fr や順序を変えた push は通り抜ける。</text></g></g></g><g><g><rect x="30" y="566" width="200" height="112" rx="5" ry="5" fill="#fecaca" stroke="#991b1b" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px"><text x="46" y="602">HARD</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px"><text x="46" y="627">ブロックするフック</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="653">判定: シェルスクリプト (exit 2)</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="250" y="566" width="920" height="112" rx="5" ry="5" fill="#ffffff" stroke="#991b1b"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="600">常時: protect-secrets、protect-harness、guard-destructive、guard-main-commit、check-commit-msg、</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="628">protect-adr、guard-agent-spawn、guard-board、guard-task-scope。hooks_strict で: guard-egress、</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="656">secret-guard、guard-config、guard-large-file、guard-deps、stop-evidence。失敗時は止める。</text></g></g></g><g><g><rect x="30" y="776" width="200" height="112" rx="5" ry="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px"><text x="46" y="812">HUMAN</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px"><text x="46" y="837">人だけ</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="863">判定: あなた</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="250" y="776" width="920" height="112" rx="5" ry="5" fill="#ffffff" stroke="#1d4ed8"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="810">すべての層の上にある。settings.json やフックへのエージェントの編集は確認を求め、シェルからの書き込みは拒否。</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="838">HARD の制御を外すには disable &lt;name&gt; を自分で入力し、.claude/disabled.json にコミットされる。</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="866">検証台帳を越える再レビューは、あなた自身の指示に REVERIFY を書いたときに一度だけ。</text></g></g></g><g><g><rect x="30" y="700" width="200" height="50" rx="5" ry="5" fill="#ffffff" stroke="#16a34a" stroke-width="2"/></g><g><g fill="#0F172A" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px"><text x="130" y="731">操作が実行される</text></g></g></g><g><g><path d="M 130 150 L 130 164.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 130 173.76 L 125.5 164.76 L 134.5 164.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><path d="M 130 288 L 130 294.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 130 303.76 L 125.5 294.76 L 134.5 294.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><path d="M 130 418 L 130 424.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 130 433.76 L 125.5 424.76 L 134.5 424.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><path d="M 130 548 L 130 554.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 130 563.76 L 125.5 554.76 L 134.5 554.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><path d="M 130 678 L 130 688.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 130 697.76 L 125.5 688.76 L 134.5 688.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><rect x="30" y="912" width="560" height="156" rx="5" ry="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#14532D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px"><text x="48" y="946">約束ではなく、証明</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="48" y="975">- ガードレール評価 314/314 (フック形式ごと、.sh と .ps1)</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="48" y="1001">- CI で Linux、macOS、Windows の上で実行</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="48" y="1027">- Claude Code で実機確認: ガードをシェルで書き換える操作を、</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="48" y="1053">- bypassPermissions モードでもブロック</text></g></g></g><g><g><rect x="610" y="912" width="560" height="156" rx="5" ry="5" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px"><text x="628" y="946">強制していないこと (明記)</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="628" y="975">- 読めるテキストをどのプロバイダーに送るか: 捕まえるツール呼び出しがない</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="628" y="1001">- 誰も名指ししていないパスの秘密、実行時に組み立てたファイル名</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="628" y="1027">- guard-agent-scope は助言のみ (ペイロードに呼び出し元がない)</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="628" y="1053">- 外部送信と実行中の設定変更: hooks_strict のときだけ</text></g></g></g></g></g></g></svg>
