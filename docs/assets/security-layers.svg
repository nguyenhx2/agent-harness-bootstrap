<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="1092" viewBox="0 0 1202 1092" role="img" aria-labelledby="security-layers-title security-layers-desc"><title id="security-layers-title">Security by design: what stands between an agent and an irreversible action</title><desc id="security-layers-desc">A ladder of five security layers between an AI agent's next action and its execution. SOFT, decided by the model: AGENTS.md, path-scoped rules and seat prompts; in the live benchmark it refused every unsafe request, but a model can outweigh it. SCOPED, decided by the runtime: per-seat tool allowlists, read-only reviewers, maxTurns, pinned models, spawn caps and the verification ledger. FORCED, decided by the permission system: deny rules for secret files, force push, hard reset, rm -rf, deploy and database reset; absolute but a literal prefix. HARD, decided by a shell script that exits 2: the always-on blocking hooks and the hooks_strict ones, failing closed. HUMAN, above every layer: edits to the harness's own settings and hooks ask the user and shell writes there are refused, and switching a hard control off takes a typed phrase recorded in a committed file. Two panels below: what proves it (the guardrail eval per hook flavour, CI on Linux, macOS and Windows, a live check in Claude Code) and what is not enforced (provider routing, secrets at unnamed paths, names built at run time, the advisory scope hook, and guards that need hooks_strict).</desc><defs/><g><g><g><g><g transform="translate(0.5,0.5)"><rect x="0" y="0" width="1200" height="1090" rx="5" ry="5" fill="#f8fafc" stroke="#cbd5e1"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#0F172A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px"><text x="30" y="48">Security by design: what stands between an agent and an irreversible action</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#475569" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="30" y="78">Only the first layer is up to the model. Each one below it is decided by something the model cannot talk its way past, and only a person can lift one.</text></g></g></g><g><g><rect x="30" y="100" width="200" height="50" rx="5" ry="5" fill="#ffffff" stroke="#9333ea" stroke-width="2"/></g><g><g fill="#0F172A" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px"><text x="130" y="131">The agent's next action</text></g></g></g><g><g><rect x="30" y="176" width="200" height="112" rx="5" ry="5" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px"><text x="46" y="212">SOFT</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px"><text x="46" y="237">Guidance</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#581C87" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="263">decided by the model</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="250" y="176" width="920" height="112" rx="5" ry="5" fill="#ffffff" stroke="#9333ea"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="210">AGENTS.md, path-scoped rules (agent-guardrails, security-privacy), each seat's prompt.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="238">Makes the right thing likely: in the live benchmark it refused every unsafe request</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="266">before a hook had to fire. But a model can outweigh it, and compaction can drop it.</text></g></g></g><g><g><rect x="30" y="306" width="200" height="112" rx="5" ry="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#14532D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px"><text x="46" y="342">SCOPED</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#14532D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px"><text x="46" y="367">Seat limits</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#14532D" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="393">decided by the runtime</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="250" y="306" width="920" height="112" rx="5" ry="5" fill="#ffffff" stroke="#16a34a"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="340">A tools allowlist per seat, with Edit and Write in disallowedTools on every review seat;</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="368">maxTurns; a pinned model and effort; spawn depth 2, at most 4 at once; the ledger refuses</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="396">a re-review of passed content. A seat cannot call a tool it was never given.</text></g></g></g><g><g><rect x="30" y="436" width="200" height="112" rx="5" ry="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px"><text x="46" y="472">FORCED</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px"><text x="46" y="497">Deny rules</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="523">decided by the permission system</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="250" y="436" width="920" height="112" rx="5" ry="5" fill="#ffffff" stroke="#dc2626"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="470">Read of .env*, keys and secrets/; git push --force, reset --hard, rm -rf, deploy, DB reset.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="498">PR create, PR merge and deploy are asked. The action never reaches a tool.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="526">Absolute for what it names, but a literal prefix: rm -fr and a reordered push walk past.</text></g></g></g><g><g><rect x="30" y="566" width="200" height="112" rx="5" ry="5" fill="#fecaca" stroke="#991b1b" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px"><text x="46" y="602">HARD</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px"><text x="46" y="627">Blocking hooks</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#7F1D1D" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="653">decided by a shell script, exit 2</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="250" y="566" width="920" height="112" rx="5" ry="5" fill="#ffffff" stroke="#991b1b"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="600">Always: protect-secrets, protect-harness, guard-destructive, guard-main-commit, check-commit-msg,</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="628">protect-adr, guard-agent-spawn, guard-board, guard-task-scope. With hooks_strict: guard-egress,</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="656">secret-guard, guard-config, guard-large-file, guard-deps, stop-evidence. Fails closed.</text></g></g></g><g><g><rect x="30" y="776" width="200" height="112" rx="5" ry="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px"><text x="46" y="812">HUMAN</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px"><text x="46" y="837">Only a person</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#1E3A8A" font-family="Helvetica" text-anchor="start" font-size="11px"><text x="46" y="863">decided by you</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="250" y="776" width="920" height="112" rx="5" ry="5" fill="#ffffff" stroke="#1d4ed8"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="810">Above every layer. An agent edit to settings.json or a hook asks you; a shell write there is refused.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="838">Switching off a HARD control takes the typed phrase disable &lt;name&gt;, committed to .claude/disabled.json.</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="14px"><text x="268" y="866">A re-review past the ledger takes REVERIFY in your own brief, once.</text></g></g></g><g><g><rect x="30" y="700" width="200" height="50" rx="5" ry="5" fill="#ffffff" stroke="#16a34a" stroke-width="2"/></g><g><g fill="#0F172A" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px"><text x="130" y="731">The action runs</text></g></g></g><g><g><path d="M 130 150 L 130 164.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 130 173.76 L 125.5 164.76 L 134.5 164.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><path d="M 130 288 L 130 294.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 130 303.76 L 125.5 294.76 L 134.5 294.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><path d="M 130 418 L 130 424.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 130 433.76 L 125.5 424.76 L 134.5 424.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><path d="M 130 548 L 130 554.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 130 563.76 L 125.5 554.76 L 134.5 554.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><path d="M 130 678 L 130 688.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/><path d="M 130 697.76 L 125.5 688.76 L 134.5 688.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10"/></g></g><g><g><rect x="30" y="912" width="560" height="156" rx="5" ry="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#14532D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px"><text x="48" y="946">Proven, not promised</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="48" y="975">- guardrail eval 312/312 per hook flavour (.sh and .ps1)</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="48" y="1001">- run in CI on Linux, macOS and Windows</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="48" y="1027">- checked live in Claude Code: a shell rewrite of a guard,</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="48" y="1053">- blocked even in bypassPermissions mode</text></g></g></g><g><g><rect x="610" y="912" width="560" height="156" rx="5" ry="5" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px"><text x="628" y="946">Not enforced, and said so</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="628" y="975">- which provider readable text is sent to: no tool call to intercept</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="628" y="1001">- secrets at a path nobody named; a file name built at run time</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="628" y="1027">- guard-agent-scope only advises (the payload names no caller)</text></g></g></g><g><g transform="translate(0.5,0.5)"></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="13px"><text x="628" y="1053">- egress and mid-session config changes: only with hooks_strict</text></g></g></g></g></g></g></svg>
