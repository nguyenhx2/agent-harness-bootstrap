[package]
name = "harness-view"
version = "0.1.0"
edition = "2021"
description = "Deterministic analyzer and viewer for a .claude/ agent harness: scan, serve, watch"
license = "MIT"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
notify = "6"

[profile.release]
strip = true
