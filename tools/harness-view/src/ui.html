<style>
  :root { --bg:#f8fafc; --panel:#ffffff; --ink:#0f172a; --line:#cbd5e1; --dim:#64748b; }
  * { box-sizing: border-box; margin: 0; }
  body { font: 13px/1.4 ui-monospace, Consolas, monospace; background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header b { margin-right: 8px; }
  button { font: inherit; padding: 4px 12px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; }
  button.active { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
  /* header buttons carry an icon beside the label; the label stays because the
     glyphs alone do not say "Master plan" */
  header button { display: inline-flex; align-items: center; gap: 6px; }
  header button svg { width: 14px; height: 14px; flex: 0 0 auto; }
  /* the checkbox sat above the neighbouring text baselines: the label was the
     only header control not centred as a flex row */
  #autowrap { display: inline-flex; align-items: center; gap: 6px; }
  #autowrap input[type=checkbox] { margin: 0; }
  /* the label is the flex item, so it has to be a row itself or the
     checkbox inside it keeps sitting above the neighbouring baselines */
  #autolbl { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  #every { font: inherit; padding: 2px 4px; border: 1px solid var(--line); background: #fff; border-radius: 5px; cursor: pointer; }
  select { font: inherit; padding: 4px 8px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; }
  #legend { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
  #legend label { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  #legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  main { flex: 1; display: flex; min-height: 0; }
  canvas { flex: 1; display: block; }
  #plan { flex: 1; overflow-y: auto; padding: 16px 24px; display: none; background: var(--panel); }
  #plan.open { display: block; }
  /* Assess tab */
  #assess { flex: 1; overflow-y: auto; padding: 16px 24px; display: none; background: var(--panel); }
  #assess.open { display: block; }
  #assess h2 { font-size: 17px; }
  #assess h3 { font-size: 14px; margin: 18px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  .ahead { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .aoverall b { font-size: 30px; }
  .aoverall b.good { color: #15803d; } .aoverall b.warn { color: #a16207; } .aoverall b.bad { color: #b91c1c; }
  .amuted { color: var(--dim); font-size: 11px; }
  .acats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .acat { flex: 1 1 150px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .acat-t { display: flex; justify-content: space-between; align-items: baseline; }
  .acat-t b.good { color: #15803d; } .acat-t b.warn { color: #a16207; } .acat-t b.bad { color: #b91c1c; }
  .abar { height: 5px; background: #e2e8f0; border-radius: 3px; margin: 5px 0 3px; overflow: hidden; }
  .abar i { display: block; height: 100%; background: #64748b; }
  .abar i.good { background: #16a34a; } .abar i.warn { background: #d97706; } .abar i.bad { background: #dc2626; }
  .anote { margin-top: 10px; font-size: 11px; color: var(--dim); background: #f8fafc;
           border-left: 3px solid var(--line); padding: 6px 8px; }
  .anotm { margin-top: 6px; font-size: 11px; color: var(--dim); }
  .anotm ul { margin: 4px 0 0 18px; }
  .astats { display: flex; gap: 10px; flex-wrap: wrap; }
  .astat { flex: 1 1 190px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 11px; }
  .astat-h { font-weight: bold; margin-bottom: 4px; }
  .astat-r { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; }
  .alink { color: #1d4ed8; cursor: pointer; text-decoration: underline dotted; }
  .afind-r { border: 1px solid var(--line); border-left-width: 3px; border-radius: 5px;
             padding: 7px 9px; margin-bottom: 6px; }
  .afind-r.sev-high { border-left-color: #dc2626; }
  .afind-r.sev-medium { border-left-color: #d97706; }
  .afind-r.sev-low { border-left-color: #64748b; }
  .afind-r.sev-info { border-left-color: #cbd5e1; }
  .afind-t { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sevtag { font-size: 10px; text-transform: uppercase; font-weight: bold; padding: 1px 6px;
            border-radius: 9px; }
  .sevtag.high { background: #fee2e2; color: #b91c1c; }
  .sevtag.medium { background: #ffedd5; color: #9a3412; }
  .sevtag.low { background: #f1f5f9; color: #475569; }
  .sevtag.info { background: #f8fafc; color: #64748b; }
  .agoto { margin-left: auto; font-size: 11px; padding: 2px 8px; }
  .afind-w { color: var(--dim); font-size: 11px; margin-top: 3px; }
  .afind-f { font-size: 10px; color: #94a3b8; margin-top: 2px; }
  #plan h1 { font-size: 19px; margin: 14px 0 8px; }
  #plan h2 { font-size: 16px; margin: 14px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  #plan h3 { font-size: 14px; margin: 12px 0 4px; }
  #plan p, #plan li { margin: 3px 0; }
  #plan ul { margin: 4px 0 4px 18px; }
  #plan table { border-collapse: collapse; margin: 0; font-size: 12px; }
  #plan th, #plan td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; }
  #plan th { background: #f1f5f9; }
  #plan .tw { overflow-x: auto; margin: 8px 0; }
  #plan code { background: #f1f5f9; padding: 1px 4px; border-radius: 3px; }
  #plan .done { color: #15803d; } #plan .todo { color: var(--dim); }
  /* width is set inline from localStorage; the grip drags it.
     A column, not a block: the metadata table takes what it needs and the file
     preview stretches into whatever is left, instead of sitting in a fixed
     340px box with the rest of a tall panel empty underneath it. */
  #detail { width: 320px; border-left: 1px solid var(--line); background: var(--panel); padding: 12px; display: none; flex: 0 0 auto; }
  #detail.open { display: flex; flex-direction: column; min-height: 0; }
  /* everything above the preview scrolls together when the panel is short */
  #detail .head { flex: 0 0 auto; overflow-y: auto; max-height: 60%; }
  #grip { flex: 0 0 6px; cursor: col-resize; background: var(--line); opacity: 0.35; display: none; }
  #grip.open { display: block; }
  #grip:hover, #grip.dragging { opacity: 0.9; }
  body.resizing { user-select: none; cursor: col-resize; }
  #detail h3 { font-size: 14px; margin-bottom: 6px; word-break: break-all; }
  #detail table.meta { width: 100%; border-collapse: collapse; margin: 8px 0; table-layout: fixed; }
  #detail table.meta td { border-top: 1px solid #e2e8f0; padding: 4px 6px 4px 0; vertical-align: top; }
  #detail table.meta tr:last-child td { border-bottom: 1px solid #e2e8f0; }
  /* the key column never wraps: "registered" used to break as "registere / d".
     104px holds the longest key plus its icon and gap at this font size. */
  #detail table.meta td.k { white-space: nowrap; width: 104px; color: var(--dim); }
  #detail table.meta td.v { word-break: break-word; overflow-wrap: anywhere; }
  #detail .desc { margin: 6px 0 2px; padding: 6px 8px; background: #f1f5f9; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
  #msg { color: #b91c1c; white-space: pre-wrap; margin-top: 8px; }
  .toggle-btn { margin-top: 8px; width: 100%; }
  .prev-btn { margin-top: 8px; width: 100%; }
  pre.preview { margin-top: 8px; padding: 8px; background: #0f172a; color: #e2e8f0; border-radius: 6px; overflow: auto; white-space: pre-wrap; word-break: break-word; font-size: 11px; }
  /* formatted rendering of a file inside the sidebar: same renderer as the plan
     tab, scaled down to the panel */
  .md { margin-top: 8px; padding: 8px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; overflow: auto; font-size: 12px; }
  /* The preview host owns the rest of the panel and scrolls inside itself. It is
     the scroller whether it is the formatted box (it also carries .md) or the
     wrapper around a raw <pre>, so no inner element needs a fixed height. */
  #detail .filehost { flex: 1 1 auto; min-height: 120px; overflow-x: hidden; overflow-y: auto; margin-top: 8px; }
  #detail .filehost > pre.preview { margin-top: 0; }
  /* Command steps. A sibling of .filehost rather than part of .head, because
     .head is capped at 60% of the panel: a ten-step command put inside it
     scrolled in a short box while the empty preview area below sat unused. Both
     are flex:1 so they share whatever .head leaves, and each scrolls itself. */
  #detail .stepbox { flex: 1 1 auto; min-height: 90px; overflow-x: hidden; overflow-y: auto; margin-top: 8px; }
  .stepbox > .lbl { color: var(--dim); font-size: 11px; }
  .stepgrp + .stepgrp { margin-top: 10px; }
  .stepgrp > .gh { font-size: 12px; font-weight: bold; margin: 6px 0 2px; word-break: break-word; }
  .stepgrp > .gintro { color: var(--dim); font-size: 11px; white-space: pre-wrap; word-break: break-word; margin: 2px 0; }
  ol.steps { margin: 4px 0 0 20px; padding: 0; }
  ol.steps > li { margin: 0 0 7px; }
  /* pre-wrap, not markdown: a step is one paragraph of prose whose line breaks
     are how the author wrote it, and every byte lands via textContent so a
     scanned repository's own text can never reach innerHTML on this path. */
  .steptext { white-space: pre-wrap; word-break: break-word; }
  .steptouch { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .steptouch .vlink { margin: 0; }
  .steptouch .vflat { padding: 1px 8px; font-size: 11px; border: 1px solid var(--line);
    border-radius: 6px; background: #f8fafc; color: #475569; }
  /* a command with no numbered list at all: its prose, exactly as written */
  .stepprose { white-space: pre-wrap; word-break: break-word; margin-top: 4px; }
  .md h1 { font-size: 15px; margin: 8px 0 4px; } .md h2 { font-size: 14px; margin: 8px 0 4px; }
  .md h3 { font-size: 13px; margin: 6px 0 3px; }
  .md p, .md li { margin: 3px 0; word-break: break-word; }
  .md ul { margin: 4px 0 4px 16px; }
  /* A table keeps its natural column widths and its wrapper scrolls. Forcing
     width:100% with word-break inside a 300px panel is what shredded a real
     task table into one-character columns. */
  .md table { border-collapse: collapse; margin: 0; font-size: 11px; }
  .md th, .md td { border: 1px solid var(--line); padding: 2px 5px; text-align: left; white-space: nowrap; }
  .md th { background: #f1f5f9; }
  .tw { overflow-x: auto; margin: 6px 0; }
  .md pre.preview { max-height: 200px; }
  .md .done { color: #15803d; } .md .todo { color: var(--dim); }
  /* GFM task items: an inert glyph, never a form control */
  .md li.taskitem, #plan li.taskitem { list-style: none; margin-left: -14px; }
  .md .tick, #plan .tick { font-size: 13px; margin-right: 3px; }
  .md .tick.done, #plan .tick.done { color: #15803d; }
  .md .tick.todo, #plan .tick.todo { color: var(--dim); }
  /* Structured file views. JSON and YAML are built with DOM APIs only, so no
     repository text ever reaches innerHTML on these paths. */
  .code { margin: 0; padding: 8px; background: #0f172a; color: #e2e8f0; border-radius: 6px;
          font-family: ui-monospace, Consolas, monospace; font-size: 11px; line-height: 1.55;
          overflow-x: auto; white-space: pre; }
  .code .jk { color: #7dd3fc; }              /* key */
  .code .js { color: #86efac; }              /* string */
  .code .jn { color: #fca5a5; }              /* number */
  .code .jb { color: #d8b4fe; }              /* boolean */
  .code .ju { color: #94a3b8; font-style: italic; }  /* null */
  .code .jp { color: #64748b; }              /* punctuation */
  .code .jc { color: #64748b; font-style: italic; }  /* comment */
  .code .ja { color: #fbbf24; }              /* yaml anchor / directive */
  /* a collapsible object or array: <details> gives keyboard support for free */
  .code details { display: block; }
  .code summary { cursor: pointer; list-style: none; display: block; }
  .code summary::-webkit-details-marker { display: none; }
  .code summary::before { content: "\25be"; color: #64748b; display: inline-block;
                          width: 11px; }
  .code details:not([open]) > summary::before { content: "\25b8"; }
  .code .count { color: #64748b; font-style: italic; }
  .code .kids { display: block; border-left: 1px solid #1e293b; margin-left: 4px;
                padding-left: 10px; }
  /* a defect in the source file, named where it shows */
  .mdwarn { margin: 8px 0 2px; padding: 6px 8px; border-left: 3px solid #d97706;
            background: #fffbeb; color: #92400e; font-size: 11px; border-radius: 0 4px 4px 0; }
  .mdraw { white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace;
           font-size: 11px; background: #fffbeb; padding: 4px 8px; overflow-x: auto; }
  /* frontmatter is metadata, not prose: in the sidebar it is the most useful
     part of an agent file, so formatted mode shows it as a keyed block */
  .fm { margin: 2px 0 6px; padding: 6px 8px; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 6px; font-size: 11px; }
  .fm div { display: flex; gap: 6px; padding: 1px 0; }
  .fm b { flex: 0 0 78px; color: #3730a3; font-weight: 600; }
  .fm span { word-break: break-word; }
  /* icon toggle: two states, current mode is the pressed one */
  .icon-btn { padding: 3px 7px; line-height: 0; display: inline-flex; align-items: center; }
  .icon-btn svg { width: 15px; height: 15px; display: block; }
  .icon-btn[aria-pressed="true"] { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  .md-bar { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .md-bar .prev-btn { margin-top: 0; }
  #plan-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  #plan-bar .lbl { color: var(--dim); }
  /* spinner: CSS only, no asset. Hidden until an operation is slow enough to
     be worth reporting, so a fast fetch never flashes it. */
  .spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: #1d4ed8; border-radius: 50%; animation: sp 0.6s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #busy { display: none; align-items: center; gap: 6px; color: var(--dim); }
  #busy.on { display: inline-flex; }
  [aria-busy="true"] { opacity: 0.6; }
  footer { padding: 4px 12px; border-top: 1px solid var(--line); background: var(--panel); color: var(--dim); display: flex; gap: 16px; }
  #root { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; width: 320px; }
  #banner { display: none; padding: 8px 12px; background: #fef2f2; color: #991b1b; border-bottom: 1px solid #fecaca; white-space: pre-wrap; }
  #banner.on { display: block; }
  #rootnow { color: var(--ink); }
  .state { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: bold; }
  .state.on { background: #dcfce7; color: #15803d; }
  .state.off { background: #fee2e2; color: #b91c1c; }
  /* sidebar: colour encodes meaning, it never decorates */
  /* The icon and the key sit in an inner wrapper, NOT on the td. `display:flex`
     on a table cell drops it out of the table formatting context: `width` and
     `table-layout: fixed` stop applying, the row splits 50/50, and the cell's
     border-top stops drawing as one continuous row separator. */
  #detail td.k .kwrap { display: flex; align-items: center; gap: 5px; }
  .kicon, .bicon { display: inline-flex; line-height: 0; flex: 0 0 auto; }
  .kicon svg { width: 11px; height: 11px; opacity: 0.65; }
  .bicon svg { width: 13px; height: 13px; margin-right: 5px; }
  button.prev-btn, button.toggle-btn { display: inline-flex; align-items: center; justify-content: center; }
  /* Disable is destructive-ish, Enable restores: different intent, different colour */
  .toggle-btn.danger { border-color: #fca5a5; color: #b91c1c; background: #fff5f5; }
  .toggle-btn.danger:hover { background: #fee2e2; }
  .toggle-btn.restore { border-color: #86efac; color: #15803d; background: #f0fdf4; }
  .toggle-btn.restore:hover { background: #dcfce7; }
  /* a value that points at another node */
  .vlink { padding: 1px 8px; font-size: 11px; color: #1d4ed8; border-color: #bfdbfe; background: #eff6ff; }
  .vlink:hover { background: #dbeafe; }
  .vmiss { color: #b91c1c; }
  .vmono { font-variant-numeric: tabular-nums; color: #475569; }
  /* cost tone: hot = expensive, cool = cheap. The word is always shown too. */
  .tone { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; }
  .tone.hot { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .tone.mid { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
  .tone.cool { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  .tone.warnv { background: #fef2f2; color: #b91c1c; border: 1px dashed #fca5a5; }
  /* folder browser: the page cannot learn a real filesystem path from a native
     picker (showDirectoryPicker returns a handle, webkitdirectory relative
     names), so the server lists directories and this walks them */
  #modal { position: fixed; inset: 0; background: rgba(15,23,42,0.45); display: none; align-items: center; justify-content: center; z-index: 10; }
  #modal.on { display: flex; }
  #modal .box { background: var(--panel); border-radius: 10px; width: min(720px, 92vw); max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
  #modal .top { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  #modal .top .cur { flex: 1; color: var(--dim); word-break: break-all; font-size: 12px; }
  #modal .body { overflow-y: auto; padding: 6px 0; flex: 1; }
  #modal .foot { padding: 10px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  .dirrow { display: flex; align-items: center; gap: 8px; padding: 5px 12px; cursor: pointer; }
  .dirrow:hover { background: #eff6ff; }
  .dirrow .nm { flex: 1; word-break: break-all; }
  .dirrow .tag { font-size: 10px; font-weight: bold; color: #15803d; background: #dcfce7; padding: 1px 6px; border-radius: 8px; }
  .dirrow.up { color: var(--dim); }
  #modal h4 { padding: 8px 12px 2px; font-size: 12px; color: var(--dim); }
  .recent { display: flex; align-items: center; gap: 8px; padding: 4px 12px; }
  .recent .p { flex: 1; cursor: pointer; word-break: break-all; }
  .recent .p:hover { text-decoration: underline; }
  .recent .x { border: none; background: none; color: var(--dim); cursor: pointer; padding: 0 4px; font-size: 14px; }
  .recent .x:hover { color: #b91c1c; }
</style>
</head>
<body>
<header>
  <b>harness-view</b>
  <button id="btn-flow">Flow</button>
  <button id="btn-graph">Graph</button>
  <button id="btn-plan" style="display:none">Master plan</button>
  <button id="btn-assess" title="Score this harness">Assess</button>
  <button id="btn-reload" title="Re-scan now">Reload</button>
  <select id="linestyle" title="Connection line style">
    <option value="curved">Curved</option>
    <option value="ortho">Orthogonal</option>
    <option value="straight">Straight</option>
  </select>
  <span id="autowrap"><label id="autolbl"><input type="checkbox" id="auto"> auto-refresh</label><select id="every" title="How often to re-scan"><option value="5">5s</option><option value="10">10s</option><option value="30">30s</option><option value="60">60s</option></select></span>
  <input id="root" list="roots" spellcheck="false" placeholder="repo path with a .claude/ folder">
  <datalist id="roots"></datalist>
  <button id="btn-browse" title="Browse for a folder">Browse</button>
  <button id="btn-load" title="Scan this folder">Load</button>
  <span id="busy" role="status" aria-live="polite"><i class="spin"></i><span id="busy-what">loading</span></span>
  <div id="legend"></div>
</header>
<div id="banner"></div>
<main>
  <canvas id="cv"></canvas>
  <div id="plan"><div id="plan-bar"></div><div id="plan-body"></div></div>
  <div id="assess"></div>
  <div id="grip" title="Drag to resize"></div>
  <aside id="detail"></aside>
</main>
<footer><span id="stats"></span><span id="rootnow"></span><span id="hint">click a node to trace its connections</span><span id="ver" style="margin-left:auto"></span></footer>
<div id="modal" role="dialog" aria-modal="true" aria-label="Choose a folder">
  <div class="box">
    <div class="top">
      <button id="m-up" title="Parent folder">Up</button>
      <span class="cur" id="m-cur"></span>
      <button id="m-close" title="Close">Close</button>
    </div>
    <div class="body" id="m-body"></div>
    <div class="foot">
      <button id="m-pick">Open this folder</button>
      <span class="cur" id="m-note"></span>
    </div>
  </div>
</div>
<script>

</script>
<script>

</script>

</body>
</html>
